[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geoflow-desktop"
version = "1.0.0"
description = "Geospatial data processing core for batch format conversion and CRS transformation."
authors = [{ name = "GeoFlow Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyogrio>=0.7.2",
    "geopandas>=0.14.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.2",
    "pydantic>=2.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
